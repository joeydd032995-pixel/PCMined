[package]
name = "solo-miner-dashboard"
version = "0.1.0"
description = "Lottery Ticket Terminal — solo crypto mining orchestrator"
authors = ["PCMined contributors"]
edition = "2021"
rust-version = "1.77"

# The Rust core is exposed as a library so logic modules (adapters, parsers,
# wallet validation, lottery/coin math) are unit-testable without a display,
# plus a thin binary that boots the Tauri app.
[lib]
name = "solo_miner_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "solo-miner-dashboard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "rt-multi-thread", "macros"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# default Tauri custom-protocol feature toggled by the bundler
custom-protocol = ["tauri/custom-protocol"]
